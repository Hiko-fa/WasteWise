<body data-page="jenis" data-root="../">

<div id="site-header"></div>

<main>
<section class="page-hero">
  <div class="container">
    <div class="box" data-anim="zoom">
    <nav class="crumb" aria-label="breadcrumb">
        <a href="../index.html">Beranda</a>
        <i class="bi bi-chevron-right"></i>
        <span>Jenis Sampah</span>
    </nav>
      <h1>Jenis <em>sampah</em></h1>
      <p>Kenali ragam sampah, contoh, dan cara menanganinya dengan benar.</p>
    </div>
  </div>
</section>

<section class="sec" style="padding-top:70px">
  <div class="container">
    <div class="area-aset-jenis" data-anim></div>
    <div class="bar-filter" data-anim>
      <div class="deret-filter">
        <button class="tombol-filter aktif" type="button" data-kategori="semua">Semua</button>
        <button class="tombol-filter" type="button" data-kategori="organik">Organik</button>
        <button class="tombol-filter" type="button" data-kategori="anorganik">Anorganik</button>
        <button class="tombol-filter" type="button" data-kategori="b3">B3</button>
        <button class="tombol-filter" type="button" data-kategori="elektronik">Elektronik</button>
      </div>
      <div class="kotak-cari">
        <i class="bi bi-search"></i>
        <input id="cariSampah" class="input-cari" type="search" placeholder="Cari jenis sampah..." aria-label="Cari jenis sampah">
      </div>
    </div>

    <p class="info-hasil" id="infoHasil"></p>
    <div class="daftar-sampah" id="daftarSampah"></div>

    <div class="keadaan-kosong" id="keadaanKosong">
      <i class="bi bi-search"></i>
      <h4 class="mt-3">Tidak ditemukan</h4>
      <p>Coba kata kunci lain atau ubah filter.</p>
      <button class="tombol-garis" id="resetCari" type="button">Reset pencarian</button>
    </div>
  </div>
</section>

<div class="modal fade" id="modalSampah" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="judul-modal" id="judulModal"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body">
        <div class="isi-modal">
          <div class="kolom-gambar-modal">
            <img id="gambarModal" class="gambar-detail" src="" alt="">
            <div id="galeriContohTambahan" class="galeri-contoh-tambahan"></div>
            <div class="mt-3" id="kategoriModal"></div>
          </div>
          <div class="kolom-teks-modal">
            <p id="deskripsiModal" class="teks-redup"></p>
            <span class="label-urai">
              <i class="bi bi-hourglass-split"></i> Waktu urai: <span id="waktuUraiModal"></span>
            </span>
            <h5 class="sub-judul">Contoh</h5>
            <ul class="daftar-detail" id="contohModal"></ul>
            <h5 class="sub-judul">Cara menangani</h5>
            <ul class="daftar-detail" id="penangananModal"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</main>

<div id="site-footer"></div>
